[metadata]
name = pyttitools-core
version = 1.0.0
description = PyTTI - AI-powered video generation with CLIP-guided iterative optimization
long_description = file: README.md
long_description_content_type = text/markdown
author = PyTTI Tools Community
url = https://github.com/pytti-tools/pytti-core
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Artistic Software
    Topic :: Multimedia :: Video
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
install_requires =
    torch >= 1.10
    torchvision
    numpy
    pillow
    opencv-python
    imageio
    imageio-ffmpeg
    einops
    kornia
    lpips
    pytorch-lightning
    scipy
    tqdm
    omegaconf
    hydra-core
    loguru
    attrs
    cattrs
    gdown >= 4.2.0
    PyGLM >= 2.5.7
    ftfy >= 6.0.3
    regex
    adjustText
    matplotlib-label-lines >= 0.4.3
    pandas >= 1.3.4
    seaborn >= 0.11.2
    scikit-learn
include_package_data = True
python_requires = >=3.8

[options.extras_require]
# Modern AI models (Stable Diffusion XL, Flux, Depth-Anything-V2, SAM 2, CoTracker)
modern =
    diffusers >= 0.31.0
    transformers >= 4.45.0
    accelerate >= 0.34.0
    safetensors >= 0.4.0
    huggingface-hub >= 0.25.0
    timm >= 0.9.0
    segment-anything-2

# Web UI (Gradio browser interface)
webui =
    gradio >= 4.44.0
    plotly >= 5.18.0

# Development dependencies
dev =
    pytest
    black
    flake8
    mypy
    pre-commit

# All features
all =
    %(modern)s
    %(webui)s
    %(dev)s

[options.entry_points]
console_scripts =
    pytti-webui = pytti.webui.app:main [webui]
    pytti-validate = pytti.validate_installation:main
    pytti-migrate = pytti.migrate_config:main
