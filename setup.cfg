[metadata]
name = pyttitools-core
version = 1.0.0
description = PyTTI - AI-powered video generation with CLIP-guided iterative optimization
long_description = file: README.md
long_description_content_type = text/markdown
author = PyTTI Tools Community
url = https://github.com/pytti-tools/pytti-core
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Artistic Software
    Topic :: Multimedia :: Video
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
install_requires =
    torch
    torchvision
    torchaudio
    numpy
    pillow
    opencv-python
    imageio
    imageio-ffmpeg
    einops
    kornia
    lpips
    pytorch-lightning
    torchmetrics
    scipy
    tqdm
    omegaconf
    hydra-core
    loguru
    attrs
    cattrs
    gdown
    PyGLM
    ftfy
    regex
    matplotlib
    adjustText
    matplotlib-label-lines
    pandas
    seaborn
    scikit-learn
    tensorboard
include_package_data = True
python_requires = >=3.8

[options.extras_require]
# Modern AI models (Stable Diffusion XL, Flux, Depth-Anything-V2, CoTracker)
modern =
    diffusers
    transformers
    accelerate
    safetensors
    huggingface-hub
    timm

# Web UI (Gradio browser interface)
webui =
    gradio
    plotly

# Development dependencies
dev =
    pytest
    black
    flake8
    mypy
    pre-commit

# All features
all =
    %(modern)s
    %(webui)s
    %(dev)s

[options.entry_points]
console_scripts =
    pytti-webui = pytti.webui.app:main [webui]
    pytti-validate = pytti.validate_installation:main
    pytti-migrate = pytti.migrate_config:main
